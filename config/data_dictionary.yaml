# ═══════════════════════════════════════════════════════════════════════════════
# TỪ ĐIỂN DỮ LIỆU (bước B1.3) – ánh xạ trường API → lược đồ chung
# Tên trường SSI theo tài liệu FastConnect Data phiên bản 2. Cột `verified` chuyển sang
# true sau khi đối chiếu với JSON gốc trong docs/api_samples/ (bước B1.2).
# Hai nguồn dùng chung lược đồ nên chuyển nguồn không ảnh hưởng tầng phân tích.
# ═══════════════════════════════════════════════════════════════════════════════
daily_stock:            # SSI DailyStockPrice  /  NEO stockDetail, stockInfo
  trade_date:   {ssi: TradingDate,          neo: tradingDate,          type: date,  unit: "dd/mm/yyyy → DATE", verified: false, desc: "Ngày giao dịch"}
  symbol:       {ssi: Symbol,               neo: symbol,               type: str,   unit: "",       verified: false, desc: "Mã chứng khoán"}
  ref:          {ssi: RefPrice,             neo: refPrice,             type: float, unit: VND,      verified: false, desc: "Giá tham chiếu (sở đã điều chỉnh quyền)"}
  ceiling:      {ssi: CeilingPrice,         neo: ceilingPrice,         type: float, unit: VND,      verified: false, desc: "Giá trần"}
  floor:        {ssi: FloorPrice,           neo: floorPrice,           type: float, unit: VND,      verified: false, desc: "Giá sàn"}
  open:         {ssi: OpenPrice,            neo: openPrice,            type: float, unit: VND,      verified: false, desc: "Giá mở cửa"}
  high:         {ssi: HighestPrice,         neo: highestPrice,         type: float, unit: VND,      verified: false, desc: "Giá cao nhất"}
  low:          {ssi: LowestPrice,          neo: lowestPrice,          type: float, unit: VND,      verified: false, desc: "Giá thấp nhất"}
  close:        {ssi: ClosePrice,           neo: closePrice,           type: float, unit: VND,      verified: false, desc: "Giá đóng cửa"}
  vol:          {ssi: TotalMatchVol,        neo: totalTradingVolume,   type: float, unit: "cổ phiếu", verified: false, desc: "Khối lượng khớp lệnh"}
  tv:           {ssi: TotalMatchVal,        neo: totalTradingValue,    type: float, unit: VND,      verified: false, desc: "Giá trị khớp lệnh (không gồm thỏa thuận)"}
  vol_pt:       {ssi: TotalDealVol,         neo: ptTotalTradedVolume,  type: float, unit: "cổ phiếu", verified: false, desc: "Khối lượng thỏa thuận"}
  tv_pt:        {ssi: TotalDealVal,         neo: ptTotalTradedValue,   type: float, unit: VND,      verified: false, desc: "Giá trị thỏa thuận"}
  fb_vol:       {ssi: ForeignBuyVolTotal,   neo: foreignBuyVolume,     type: float, unit: "cổ phiếu", verified: false, desc: "KL khối ngoại mua"}
  fs_vol:       {ssi: ForeignSellVolTotal,  neo: foreignSellVolume,    type: float, unit: "cổ phiếu", verified: false, desc: "KL khối ngoại bán"}
  fb:           {ssi: ForeignBuyValTotal,   neo: foreignBuyValue,      type: float, unit: VND,      verified: false, desc: "Giá trị khối ngoại mua (kiểm tra phạm vi ở B2.5)"}
  fs:           {ssi: ForeignSellValTotal,  neo: foreignSellValue,     type: float, unit: VND,      verified: false, desc: "Giá trị khối ngoại bán"}
  remain:       {ssi: ForeignCurrentRoom,   neo: foreignRemain,        type: float, unit: "cổ phiếu", verified: false, desc: "Room ngoại còn lại"}
  room:         {ssi: null,                 neo: foreignRoom,          type: float, unit: "cổ phiếu", verified: false, desc: "Tổng room = giới hạn sở hữu × ListedShare (SSI không trả trực tiếp ở REST ngày)"}

daily_index:            # SSI DailyIndex  /  NEO marketInfo
  trade_date:   {ssi: TradingDate,          neo: tradingDate,          type: date,  unit: "",       verified: false, desc: "Ngày"}
  index_code:   {ssi: IndexId,              neo: marketCode,           type: str,   unit: "",       verified: false, desc: "Mã chỉ số"}
  value:        {ssi: IndexValue,           neo: indexValue,           type: float, unit: "điểm",   verified: false, desc: "Điểm chỉ số"}
  change:       {ssi: Change,               neo: indexChange,          type: float, unit: "điểm",   verified: false, desc: "Thay đổi điểm"}
  ratio_change: {ssi: RatioChange,          neo: indexPercentChange,   type: float, unit: "%",      verified: false, desc: "Thay đổi %"}
  advances:     {ssi: Advances,             neo: advances,             type: int,   unit: "mã",     verified: false, desc: "Số mã tăng"}
  declines:     {ssi: Declines,             neo: declines,             type: int,   unit: "mã",     verified: false, desc: "Số mã giảm"}
  no_changes:   {ssi: NoChanges,            neo: noChanges,            type: int,   unit: "mã",     verified: false, desc: "Số mã đứng"}
  ceilings:     {ssi: Ceilings,             neo: numberOfCe,           type: int,   unit: "mã",     verified: false, desc: "Số mã trần"}
  floors:       {ssi: Floors,               neo: numberOfFl,           type: int,   unit: "mã",     verified: false, desc: "Số mã sàn"}
  vol:          {ssi: TotalMatchVol,        neo: totalVolume,          type: float, unit: "cổ phiếu", verified: false, desc: "KL khớp"}
  tv:           {ssi: TotalMatchVal,        neo: totalValue,           type: float, unit: VND,      verified: false, desc: "GTGD khớp"}
  open:         {ssi: OpenIndex,            neo: openIndex,            type: float, unit: "điểm",   verified: false, desc: "Mở cửa (DailyOhlc nếu DailyIndex không có)"}
  high:         {ssi: HighestIndex,         neo: highestIndex,         type: float, unit: "điểm",   verified: false, desc: "Cao nhất"}
  low:          {ssi: LowestIndex,          neo: lowestIndex,          type: float, unit: "điểm",   verified: false, desc: "Thấp nhất"}

securities:             # SSI SecuritiesDetails
  symbol:       {ssi: Symbol,      type: str,   unit: "",          verified: false, desc: "Mã"}
  sec_type:     {ssi: SecType,     type: str,   unit: "",          verified: false, desc: "Loại CK (ST = cổ phiếu thường)"}
  exchange:     {ssi: Exchange,    type: str,   unit: "",          verified: false, desc: "Sàn"}
  listed_share: {ssi: ListedShare, type: float, unit: "cổ phiếu",  verified: false, desc: "Số cổ phiếu niêm yết S_i"}

intraday:               # SSI IntradayOhlc / kênh B
  ts:           {ssi: "TradingDate + Time", type: timestamp, unit: "Asia/Ho_Chi_Minh", verified: false, desc: "Thời điểm nến"}
  open:         {ssi: Open,   type: float, unit: VND, verified: false, desc: ""}
  high:         {ssi: High,   type: float, unit: VND, verified: false, desc: ""}
  low:          {ssi: Low,    type: float, unit: VND, verified: false, desc: ""}
  close:        {ssi: Close,  type: float, unit: VND, verified: false, desc: ""}
  vol:          {ssi: Volume, type: float, unit: "cổ phiếu", verified: false, desc: ""}

streaming:              # SSI streaming & NEO WebSocket
  side:         {ssi: "X-TRADE.Side",            neo: null,               type: str,   unit: "BU/SD", desc: "Chiều khớp chủ động – chỉ có thời gian thực"}
  oddlot_value: {ssi: "OL",                      neo: oddLotTotalValue,   type: float, unit: VND,     desc: "Giá trị lô lẻ"}
  market_status: {ssi: "F.TradingSession",        neo: marketStatus,       type: str,   unit: "",      desc: "Trạng thái phiên"}
