# ═══════════════════════════════════════════════════════════════════════════════
# FTSE Flow Radar 3.2 – THAM SỐ TẬP TRUNG (bước B0.6)
# Mọi ngưỡng, cửa sổ, trọng số đọc từ tệp này qua src.common.config.load_settings().
# Không viết cứng ngưỡng trong mã nguồn. Trang 8 "Phương pháp" hiển thị trực tiếp tệp này.
# ═══════════════════════════════════════════════════════════════════════════════
app:
  name: "FTSE Flow Radar"
  version: "3.2"
  subtitle: "MARKET INTELLIGENCE"
  timezone: "Asia/Ho_Chi_Minh"
  disclaimer: "Đề tài nghiên cứu học thuật, không mang tính chất khuyến nghị đầu tư."
  bot_disclaimer: "Thông tin phân tích, không phải khuyến nghị giao dịch."

paths:
  db: "data/ffr.duckdb"
  log_file: "logs/app.log"
  reports_dir: "reports_out"
  checkpoint_dir: "data/checkpoints"

# Dữ liệu lịch sử
history:
  start_date: "2016-01-01"     # ~2 700 phiên, phủ nhiều chu kỳ (tăng 2016–18, COVID 2020, bùng nổ 2021, sụp 2022, FTSE 2025–26)
  exchange: "HOSE"
  index_codes: ["VNINDEX", "VN30", "HNXINDEX", "UPCOMINDEX"]

# ── Làm sạch (mục 8.1) ────────────────────────────────────────────────────────
cleaning:
  winsor_lower: 0.01
  winsor_upper: 0.99
  max_abs_return: 0.07        # biên độ HOSE; vượt ngưỡng ghi data_quality_log (trừ ngày đầu niêm yết)
  completeness_target: 0.98
  breadth_tolerance: 2        # lệch tối đa (mã) khi đối chiếu độ rộng với SSI

# ── Cửa sổ ───────────────────────────────────────────────────────────────────
windows:
  z_window: 60                # z-score dòng vốn: 60 phiên trước, chỉ dữ liệu đến t−1
  pct_windows: [20, 60, 250]  # phân vị lịch sử
  high_div_window: 250
  high_div_pct: 90            # nhãn "độ vênh cao" khi D ≥ phân vị 90 của 250 phiên trước
  beta_window: 120            # beta Dimson
  beta_min_obs: 100
  intraday_sessions: 20       # beta nội ngày
  er_sd_window: 60
  sparkline_index: 40
  sparkline_stock: 30
  ma_short: 20
  ma_long: 50
  rsi_period: 14

# ── Module A ─────────────────────────────────────────────────────────────────
breadth:
  flat_threshold_pct: 0.1     # |r_VNI| < 0,1% → "đi ngang"
contribution:
  eps_median_target: 0.5      # trung vị |ε| mục tiêu (điểm)
  top_n: 5
  family_default: "VINGROUP"

# ── Module B ─────────────────────────────────────────────────────────────────
foreign:
  denominator: "match_plus_deal"   # SSI gộp thỏa thuận vào giá trị mua/bán khối ngoại → mẫu số = khớp + thỏa thuận (cận dưới max(FB, FS))
  absorb_nf_min: 0.05         # |nf| tối thiểu để gán trạng thái hấp thụ
  absorb_ret_min: 0.005       # |r| tối thiểu (0,5%)
  streak_reversal_min: 3      # đảo chiều sau chuỗi ≥ 3 phiên
  top_value_n: 10             # NF_top: mua ròng chuẩn hóa vào Top10 vốn hóa

# ── Sức khỏe thị trường (khối B4.5d) – tổng = 100 ─────────────────────────────
health_weights:
  trend: 30
  momentum: 15
  perf20: 15
  breadth: 25
  divergence: 15
health_labels:
  positive: 70
  caution: 40

# ── Module C: nghiên cứu sự kiện (mục 8.4, 9) ────────────────────────────────
events:
  estimation_window: [-130, -11]
  estimation_window_long: [-250, -11]   # kiểm tra độ vững
  event_window: [-10, 20]
  car_windows: [[-1, 1], [-5, 5], [-10, 10], [0, 20]]
  min_est_obs: 100
  large_weight_threshold: 0.03          # mã có w ≥ 3% dùng VN-Index loại trừ chính mã
  did_event: "E3"
  did_window: [-60, 60]
  did_weeks: [-8, 8]
  bootstrap_reps: 2000
  permutation_reps: 5000
  permutation_block: 5
  regime_split_date: "2026-09-21"
  h1a_pre_sessions: 250                 # H1a: số phiên trước mốc đem so (0 = toàn bộ lịch sử – kiểm tra độ vững)
  h1b_dI_min: 10
  nw_lags: 5
  alpha: 0.05
  min_obs_per_type: 15                  # RQ4: Kruskal–Wallis chỉ khi mỗi loại ≥ 15 phiên

# ── H4: so sánh cấu trúc thị trường theo giai đoạn nâng hạng ────────────────
periods:
  announce: "2025-10-08"                # E1 – FTSE công bố nâng hạng
  effective: "2026-09-21"               # ngày hiệu lực (sau phiên E3 18/09/2026)
  pre_sessions: 250                     # nhóm cơ sở = 250 phiên ngay trước E1 (≈ 1 năm, so sánh được về độ dài)
  pre_start: "2019-01-02"               # độ vững: cơ sở dài từ 2019 (ε 2016–2018 kém hơn – xem README §9)

# ── Triển vọng thống kê trong báo cáo (src/analytics/outlook.py) ─────────────
outlook:
  ewma_lambda: 0.94                     # RiskMetrics
  horizons: [5, 20]                     # số phiên tới
  history_start: "2019-01-02"           # dữ liệu dùng cho kiểm chứng biên dao động và phiên tương tự
  min_analog: 30                        # ít hơn → bỏ điều kiện khối ngoại
  movers_min_tv_bn: 10                  # "cổ phiếu nổi bật" trong PDF: chỉ mã GTGD ≥ 10 tỷ (loại mã thanh khoản rất thấp)
  control_lookback: 120                 # thanh khoản bình quân 120 phiên trước E1

# ── Cảnh báo (mục 8.6) ───────────────────────────────────────────────────────
alerts:
  dI_min: 5                   # quy tắc 1: |ΔI| ≥ 5 điểm
  cr5_min: 0.60               #            và CR5 ≥ 60%
  div_pct: 90                 # quy tắc 2: D ≥ phân vị 90 của 250 phiên
  z_total_nf: 2.0             # quy tắc 3: |z| tổng NF HOSE ≥ 2
  wl_nf_pct_hi: 95            # quy tắc 4
  wl_nf_pct_lo: 5
  wl_er_sd_mult: 2.0          # quy tắc 5: |ER_M| ≥ 2 lần độ lệch chuẩn 60 phiên
  wl_top_n: 5                 # quy tắc 6
  room_used_min: 0.95         # quy tắc 7
  stale_minutes: 5            # quy tắc 8
  cooldown_min: 30
  max_market_per_day: 1      # ~1 cảnh báo thị trường mỗi ngày (ưu tiên mức cao) – tránh gây nhiễu cho người dùng bận rộn
  priority: {high: 1, medium: 2, low: 3, system: 0}
  backtest_sessions: 60

# ── Nguồn dữ liệu: CHỈ SSI FastConnect V3 (developers.ssi.com.vn) ─────────────
# REST  : POST /api/v3/auth/token {apiKey, apiSecret} → Bearer JWT; GET /api/v3/data/*
# Stream: wss://stream.ssi.com.vn/ws/v3 (SDK chính thức ssi-sdk) – indexsummary, trade.index, room, trade
ssi:
  base_url: "https://api.ssi.com.vn"          # .env SSI_BASE_URL ghi đè
  stream_url: "wss://stream.ssi.com.vn/ws/v3" # .env SSI_STREAM_URL ghi đè
  min_interval_sec: 0.06      # máy chủ báo X-RateLimit-Limit = 20 yêu cầu/giây
  retries: 3
  backoff_sec: [2, 4, 8]
  page_size: 1000
  timeout_sec: 60
  intraday_timeframe: "5m"
stream:
  silence_sec: 120            # luồng im lặng > 120 giây trong phiên → ghi sự cố, SDK tự kết nối lại
  flush_rows: 200
  live_build: true            # trong phiên: dựng phiên tạm tính từ luồng cả sàn HOSE cho web (src/data/live.py)
  live_build_sec: 120         # chu kỳ dựng (giây) → độ trễ số liệu trên web ≈ 2–3 phút

# ── Lịch phiên & tác vụ (giờ Việt Nam) ───────────────────────────────────────
session:
  open: "09:00"
  close: "15:00"
  recorder_start: "08:55"
  recorder_end: "15:05"
schedule:
  midday_brief: "11:35"
  midday_until: "13:00"       # khởi động muộn hơn → bỏ bản tin giữa phiên
  close_update: "15:05"       # tải bù mọi phiên thiếu + dựng lại chỉ báo/kiểm định/triển vọng (src/data/updater.py)
  update_until: "20:00"
  update_retry_min: 30        # lỗi API → thử lại sau 30 phút
  quality_check: "15:10"
  closing_report: "15:15"
  closing_until: "21:00"
  late_update: "22:00"        # lượt dự phòng mỗi tối
update:
  repair_lookback: 10         # tải lại các phiên trong 10 phiên gần nhất mà SSI để trống khối ngoại cho mọi mã

watchlist_default: ["FPT", "HPG", "MBB", "VNM", "SSI"]
watchlist_max: 15

# ── Tối ưu danh mục theo khẩu vị rủi ro (src/analytics/portfolio.py) ─────────
portfolio:
  lookback: 250               # số phiên ước lượng (≈ 1 năm)
  risk_free: 0.045            # lãi suất phi rủi ro năm (tham chiếu tiền gửi 12 tháng)
  backtest_months: 60         # kiểm chứng ngoài mẫu 5 năm (qua cả chu kỳ giảm 2022), tái cân bằng hằng tháng
  cost_per_turnover: 0.0025   # chi phí giao dịch / 1 đơn vị doanh số tái cân bằng (phí môi giới ~0,15% + thuế bán 0,1%)
  profiles:                   # biến động năm mục tiêu · trần tỷ trọng một mã · beta tối đa phù hợp
    "Thận trọng": {target_vol: 0.15, max_weight: 0.25, max_beta: 0.9}
    "Cân bằng": {target_vol: 0.22, max_weight: 0.30, max_beta: 1.1}
    "Tăng trưởng": {target_vol: 0.30, max_weight: 0.40, max_beta: 1.4}

# Đẩy dữ liệu phiên mới lên GitHub sau khi tải xong số liệu cuối ngày → bản công khai (Streamlit Cloud) tự cập nhật.
# Chỉ commit thư mục data/snapshot_delta (tools/publish_data.py). Đặt false nếu không muốn máy tự push.
publish:
  auto_push: true            # sau khi chốt số liệu cuối ngày: đẩy data/snapshot_delta
  live_push: true            # trong phiên: đẩy số liệu tạm tính của hôm nay (data/live_snapshot) để bản công khai cập nhật theo phút
  live_push_sec: 120         # khoảng cách tối thiểu giữa hai lần đẩy (giây)
